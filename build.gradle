plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_label}-${mod_version}"
group = mod_group_id

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
java.withSourcesJar()

// Test-only data, on the classpath only when running the GameTests: src/gametest/resources as is (it wins over the
// mod's files at the same path), and for data maps, which allow one file per namespace, the mod's own entries merged
// with the test entries from src/gametest/datamaps.
if (gradle.startParameter.taskNames.any { it.contains('GameTest') }) {
    def mergedDataMaps = layout.buildDirectory.dir('gametest-datamaps')
    def mergeTestDataMaps = tasks.register('mergeTestDataMaps') {
        def modMaps = file('src/main/resources/data/feathers_of_fatigue/data_maps/entity_type')
        def testMaps = file('src/gametest/datamaps')
        inputs.dir(modMaps)
        inputs.dir(testMaps)
        outputs.dir(mergedDataMaps)
        doLast {
            def slurper = new groovy.json.JsonSlurper()
            testMaps.eachFile { testFile ->
                def modFile = new File(modMaps, testFile.name)
                def merged = modFile.exists() ? slurper.parse(modFile) : [replace: false, values: [:]]
                merged.values.putAll(slurper.parse(testFile).values)
                def out = mergedDataMaps.get().file("data/feathers_of_fatigue/data_maps/entity_type/${testFile.name}").asFile
                out.parentFile.mkdirs()
                out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged))
            }
        }
    }
    sourceSets.main.resources.srcDirs = [files(mergedDataMaps).builtBy(mergeTestDataMaps), 'src/gametest/resources'] + sourceSets.main.resources.srcDirs
    tasks.named('processResources', ProcessResources) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
}

// The public API lives in its own source set and ships twice: inside the mod jar, and alone as
// feathers-of-fatigue-api for other mods to compile against.
sourceSets {
    api
}

repositories {
    mavenCentral()
    // Droplets of Thirst: `./gradlew publishToMavenLocal` in its repository.
    mavenLocal {
        content { includeGroup 'com.darkona.dropletsofthirst' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.api)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless client straight into a copy of a world: scripts or `xvfb-run ./gradlew runBootCheck`.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--quickPlaySingleplayer', 'gfboot'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation sourceSets.api.output

    // Bundled, so the mod runs with nothing else installed. The range lets other mods' copies resolve to one version.
    jarJar(implementation("dev.darkona.jdlib:JDLib")) {
        version {
            strictly jdlib_range
            prefer jdlib_version
        }
    }

    // Optional compat: every use sits behind a ModList check.
    compileOnly "maven.modrinth:cold-sweat:${cold_sweat_version}"
    compileOnly "maven.modrinth:thirst-was-taken:${thirst_was_taken_version}"
    compileOnly "com.darkona.dropletsofthirst:droplets-of-thirst-api:${droplets_of_thirst_version}"
    compileOnly "maven.modrinth:tough-as-nails:${tough_as_nails_version}"
    compileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    compileOnly "maven.modrinth:legendary-survival-overhaul:${lso_version}"
    compileOnly "maven.modrinth:overflowing-bars:${overflowing_bars_version}"
    compileOnly "maven.modrinth:puzzles-lib:${puzzles_lib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Compat mods on the dev runtime, for boot checks and GameTests with them loaded:
//   ./gradlew runGameTestServer -Pcompat=coldsweat,thirst,overflowingbars
//   ./gradlew runGameTestServer -Pcompat=toughasnails,sereneseasons
def compatRuntime = [
        coldsweat      : ["maven.modrinth:cold-sweat:${cold_sweat_version}"],
        thirst         : ["maven.modrinth:thirst-was-taken:${thirst_was_taken_version}"],
        dropletsofthirst: ["com.darkona.dropletsofthirst:droplets-of-thirst:${droplets_of_thirst_version}"],
        toughasnails   : ["maven.modrinth:tough-as-nails:${tough_as_nails_version}", "maven.modrinth:glitchcore:${glitchcore_version}"],
        sereneseasons  : ["maven.modrinth:serene-seasons:${serene_seasons_version}", "maven.modrinth:glitchcore:${glitchcore_version}"],
        lso            : ["maven.modrinth:legendary-survival-overhaul:${lso_version}"],
        appleskin      : ["maven.modrinth:appleskin:${appleskin_version}"],
        jade           : ["maven.modrinth:jade:${jade_version}"],
        naturalist     : ["maven.modrinth:naturalist:${naturalist_version}", "maven.modrinth:geckolib:${geckolib_version}"],
        mobwrangler    : ["maven.modrinth:mob-wrangler:${mob_wrangler_version}"],
        overflowingbars: ["maven.modrinth:overflowing-bars:${overflowing_bars_version}", "maven.modrinth:puzzles-lib:${puzzles_lib_version}"],
]
if (project.hasProperty('compat')) {
    dependencies {
        project.property('compat').toString().split(',').each { name ->
            def coordinates = compatRuntime[name.trim()]
            if (coordinates == null) throw new GradleException("Unknown compat '${name}'. Known: ${compatRuntime.keySet().join(', ')}")
            coordinates.each { localRuntime it }
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            cold_sweat_range       : cold_sweat_range,
            thirst_range           : thirst_range,
            droplets_of_thirst_range: droplets_of_thirst_range,
            tough_as_nails_range   : tough_as_nails_range,
            serene_seasons_range   : serene_seasons_range,
            lso_range              : lso_range,
            overflowing_bars_range : overflowing_bars_range,
            jdlib_range            : jdlib_range,
            curios_range           : curios_range,
            jade_range             : jade_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from sourceSets.api.output
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
}

var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${archives_base_name}-api"
    from sourceSets.api.output
}
var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${archives_base_name}-api"
    archiveClassifier = 'sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn apiJar, apiSourcesJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
        register('api', MavenPublication) {
            artifactId = "${archives_base_name}-api"
            artifact apiJar
            artifact apiSourcesJar
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The toolchain is Java 25 (java_version), which runs the game and the GameTests; the jar stays Java 21
// (java_release), so it still loads for players on Java 21.
tasks.withType(JavaCompile).configureEach {
    options.release = java_release as int
}
