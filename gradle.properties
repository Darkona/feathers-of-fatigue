org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

minecraft_version=1.20.1
java_version=17
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.10
forge_version_range=[47.4.10,)
loader_version_range=[47,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.1.0
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

mixinextras_version=0.4.1

# Optional compat targets (Modrinth version ids, 1.20.1 Forge; the version number is in the comment)
# Cold Sweat 2.4.5
cold_sweat_version=z3qJDJxm
# Thirst Was Taken 1.20.1-1.4.0
thirst_was_taken_version=v0d2UK5F
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
ci_deps=droplets-of-thirst:droplets_of_thirst_version
droplets_of_thirst_version=1.20.1-1.1.0
# Tough As Nails 9.2.0.171
tough_as_nails_version=kWVOI0iS
# Serene Seasons 9.1.0.3
serene_seasons_version=WMrhrybF
# GlitchCore 0.0.1.1
glitchcore_version=pYPZ5MNI
# AppleSkin 2.5.1+mc1.20.1
appleskin_version=XdXDExVF
# Jade 11.13.3+forge
jade_version=xJQHCmWJ
# Naturalist 5.0pre2
naturalist_version=LbtmTtvK
# GeckoLib 4.8.4
geckolib_version=aC5KMoNg
# Legendary Survival Overhaul 1.20.1-2.4.7
lso_version=BsBOQNzX
# Overflowing Bars v8.0.1-1.20.1-Forge
overflowing_bars_version=w90XIUWB
# Puzzles Lib v8.1.33-1.20.1-Forge
puzzles_lib_version=mIyVGf3d
curios_version=5.14.1+1.20.1
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
cold_sweat_range=[2.4.3.2,3)
thirst_range=[1.20.1-1.4.0,1.20.1-2)
droplets_of_thirst_range=[1.20.1-1.0.0,1.20.1-2)
tough_as_nails_range=[9.2.0.171,10)
serene_seasons_range=[9.1.0.3,10)
lso_range=[1.20.1-2.4.7,1.20.1-3)
overflowing_bars_range=[8.0.1,9)
curios_range=[5.14.1,6)
jade_range=[11.13.3,12)
