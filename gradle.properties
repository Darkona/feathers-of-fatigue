org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
java_version=25
java_release=21
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.252,)
loader_version_range=[4,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.1.0
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

# Optional compat targets (Modrinth version ids / numbers, 1.21.1 NeoForge)
cold_sweat_version=2.4.3.1
thirst_was_taken_version=1.21.1-2.1.5
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
ci_deps=droplets-of-thirst:droplets_of_thirst_version
droplets_of_thirst_version=1.21.1-1.1.0
tough_as_nails_version=mboAbksk
serene_seasons_version=pHEgQQUE
glitchcore_version=S2TfWrZR
appleskin_version=uAKA6Laj
jade_version=eYz2YBGT
naturalist_version=RzdhM6Zg
geckolib_version=Grwn5rUB
mob_wrangler_version=tkWWYcq0
lso_version=1.21.1-2.4.7.2
overflowing_bars_version=v21.1.1-1.21.1-NeoForge
puzzles_lib_version=21.1.60
curios_version=9.5.1+1.21.1
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
cold_sweat_range=[2.4.3.1,3)
thirst_range=[1.21.1-2.1.5,1.21.1-3)
droplets_of_thirst_range=[1.21.1-1.0.0,1.21.1-2)
tough_as_nails_range=[10.1.0.13,11)
serene_seasons_range=[10.1.0.9,11)
lso_range=[2.4.7.2,3)
overflowing_bars_range=[21.1.1,22)
# JDLib is bundled (jar-in-jar); its range keeps one copy loaded. It does not need LDLib2.
jdlib_version=1.0.0
jdlib_range=[1.0.0,2.0.0)
curios_range=[9.5.1,10)
jade_range=[15.10.6,16)
